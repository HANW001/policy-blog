# nginx 리버스 프록시 설정 — policy-blog (도메인 연결 직후, certbot 발급 전 80-only 구성)
#
# 설치:
#   sudo cp policy-blog/deploy/nginx.conf /etc/nginx/sites-available/policy-blog
#   sudo ln -s /etc/nginx/sites-available/policy-blog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN --redirect
#
# YOUR_DOMAIN은 실제 값으로 교체.
# 주의: 443 server 블록을 여기서 미리 써두면 안 된다 — ssl_certificate 파일이
# 아직 없는 상태로 nginx -t를 돌리면 "no ssl_certificate is defined" 에러로 실패한다
# (policynote.io.kr 배포 시 실제로 겪은 문제). certbot --nginx가 인증서 발급 후
# 443 블록과 80→443 redirect를 이 파일에 알아서 추가해준다 — 그게 끝나면
# /etc/nginx/sites-available/policy-blog를 다시 읽어서 결과를 확인할 것.
#
# 참고: quant-family(deploy/nginx.conf)와 동일한 구조. Next.js는 `/_next/static/`에
# 해시된 정적 자산을 자체적으로 immutable 캐시 헤더와 함께 서빙하므로,
# quant-family처럼 별도 alias 블록 없이 전체를 Next.js(포트 3001)로 프록시한다.

# gzip은 /etc/nginx/nginx.conf(http 블록)에서 이미 활성화되어 있어 여기서 선언하지 않음.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 5m;

    # certbot webroot 인증용
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Next.js(policy-blog) 앱으로 프록시
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
